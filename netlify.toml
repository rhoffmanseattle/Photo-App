# Netlify build config for photo.longwalkhome.net

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # FLICKR_API_KEY and FLICKR_USER_ID are set in the Netlify UI as env vars.
  # Do not put real values in this file - it is committed to GitHub.
  # The serverless function below reads the same two env vars at runtime.

# Serverless functions. home-recent fetches the latest photos from Flickr
# on request so the home grid can refresh without a redeploy (see
# assets/home-live.js). esbuild bundles the shared build/templates/* modules.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Image proxy: /img/* is served from Flickr's CDN through Netlify's proxy.
# Visitors fetch images from photo.longwalkhome.net (same origin) and
# Netlify's CDN fetches/caches from live.staticflickr.com. This avoids
# Flickr's per-IP rate limiting (429s) for visitors behind shared-IP
# egress like iCloud Private Relay, which routes all Safari traffic
# through a small set of Apple relay IPs that Flickr throttles.
[[redirects]]
  from = "/img/*"
  to = "https://live.staticflickr.com/:splat"
  status = 200

# Clean URL for photo permalinks: /p/{id} resolves to /p/{id}/index.html.
[[redirects]]
  from = "/p/:id"
  to = "/p/:id/index.html"
  status = 200

# Same pattern for collection pages.
[[redirects]]
  from = "/c/:slug"
  to = "/c/:slug/index.html"
  status = 200

# Same pattern for camera group pages (auto-generated from EXIF).
[[redirects]]
  from = "/g/:slug"
  to = "/g/:slug/index.html"
  status = 200
