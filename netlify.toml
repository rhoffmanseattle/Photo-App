# Netlify build config for photo.longwalkhome.net

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # FLICKR_API_KEY and FLICKR_USER_ID are set in the Netlify UI as env vars.
  # Do not put real values in this file - it is committed to GitHub.

# Clean URL for photo permalinks: /p/{id} resolves to /p/{id}/index.html.
[[redirects]]
  from = "/p/:id"
  to = "/p/:id/index.html"
  status = 200

# Same pattern for collection pages.
[[redirects]]
  from = "/c/:slug"
  to = "/c/:slug/index.html"
  status = 200
